# ticketbench: databases, store services, runner and observability.
#   docker compose up -d --wait
#   tbench --runner localhost:7070 matrix --config config/matrix.yaml
# Memory budgets are equal for the three disk-based engines (1 GB cache each).

x-store: &store
  restart: unless-stopped
  environment: &store-env
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    OTEL_EXPORTER_OTLP_INSECURE: "true"
    TB_TRACE_RATIO: "1"
    TB_MAX_CONNS: "1100"
  depends_on:
    otel-collector:
      condition: service_started

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ticketbench
      POSTGRES_PASSWORD: ticketbench
      POSTGRES_DB: ticketbench
    command: >
      postgres -c max_connections=1200 -c shared_buffers=1GB -c effective_cache_size=2GB
      -c work_mem=16MB -c maintenance_work_mem=512MB -c max_wal_size=4GB
      -c random_page_cost=1.1 -c jit=off
    shm_size: 1g
    volumes: [pg-data:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketbench -d ticketbench"]
      interval: 3s
      retries: 40

  mariadb:
    image: mariadb:11.8
    environment:
      MARIADB_USER: ticketbench
      MARIADB_PASSWORD: ticketbench
      MARIADB_DATABASE: ticketbench
      MARIADB_ROOT_PASSWORD: ticketbench
    command: >
      --max-connections=1200 --innodb-buffer-pool-size=1G --innodb-log-file-size=512M
      --max-allowed-packet=64M --thread-cache-size=200
    volumes: [maria-data:/var/lib/mysql]
    ports: ["3306:3306"]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      retries: 40

  mongo:
    image: mongo:8.0
    command: ["--replSet", "rs0", "--bind_ip_all", "--wiredTigerCacheSizeGB", "1"]
    volumes: [mongo-data:/data/db]
    ports: ["27017:27017"]
    healthcheck:
      # Initiates the single-node replica set on first start (transactions need it).
      test: ["CMD", "mongosh", "--quiet", "--eval",
             "try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]}).ok }"]
      interval: 3s
      retries: 40

  valkey:
    image: valkey/valkey:8.1
    # In-memory store: no RDB snapshots and no AOF during benchmarks.
    command: ["valkey-server", "--save", "", "--appendonly", "no", "--maxclients", "10000"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 3s
      retries: 40

  store-postgres:
    <<: *store
    image: ghcr.io/ryczek02/ticketbench-store-postgres:${TB_VERSION:-latest}
    environment:
      <<: *store-env
      TB_LISTEN: ":7001"
      TB_POSTGRES_DSN: postgres://ticketbench:ticketbench@postgres:5432/ticketbench?sslmode=disable
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["7001:7001"]

  store-mariadb:
    <<: *store
    image: ghcr.io/ryczek02/ticketbench-store-mariadb:${TB_VERSION:-latest}
    environment:
      <<: *store-env
      TB_LISTEN: ":7002"
      TB_MARIADB_DSN: ticketbench:ticketbench@tcp(mariadb:3306)/ticketbench
    depends_on:
      mariadb: { condition: service_healthy }
    ports: ["7002:7002"]

  store-mongo:
    <<: *store
    image: ghcr.io/ryczek02/ticketbench-store-mongo:${TB_VERSION:-latest}
    environment:
      <<: *store-env
      TB_LISTEN: ":7003"
      TB_MONGO_URI: mongodb://mongo:27017/?replicaSet=rs0
    depends_on:
      mongo: { condition: service_healthy }
    ports: ["7003:7003"]

  store-valkey:
    <<: *store
    image: ghcr.io/ryczek02/ticketbench-store-valkey:${TB_VERSION:-latest}
    environment:
      <<: *store-env
      TB_LISTEN: ":7004"
      TB_VALKEY_ADDR: valkey:6379
    depends_on:
      valkey: { condition: service_healthy }
    ports: ["7004:7004"]

  bench-runner:
    <<: *store
    image: ghcr.io/ryczek02/ticketbench-bench-runner:${TB_VERSION:-latest}
    environment:
      <<: *store-env
      TB_LISTEN: ":7000"
      TB_STORES: postgres=store-postgres:7001,mariadb=store-mariadb:7002,mongo=store-mongo:7003,valkey=store-valkey:7004
    depends_on:
      store-postgres: { condition: service_healthy }
      store-mariadb: { condition: service_healthy }
      store-mongo: { condition: service_healthy }
      store-valkey: { condition: service_healthy }
    # 7000 is taken by AirPlay on macOS, so the host side uses 7070.
    ports: ["${TB_RUNNER_PORT:-7070}:7000"]

  # The CLI as a container: docker compose run --rm tbench matrix ...
  tbench:
    image: ghcr.io/ryczek02/ticketbench-cli:${TB_VERSION:-latest}
    profiles: [cli]
    # Write results as the calling user (Ansible passes its uid/gid).
    user: "${TB_UID:-0}:${TB_GID:-0}"
    environment:
      TBENCH_RUNNER: bench-runner:7000
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_INSECURE: "true"
    working_dir: /work
    volumes:
      - ./results:/work/results
      - ./config:/work/config:ro
    depends_on:
      bench-runner: { condition: service_healthy }

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.140.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./otel/collector.yaml:/etc/otelcol/config.yaml:ro"]
    ports: ["4317:4317", "4318:4318"]

  jaeger:
    image: jaegertracing/jaeger:2.12.0
    ports: ["16686:16686"]

  prometheus:
    image: prom/prometheus:v3.7.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--web.enable-otlp-receiver"]
    volumes: ["./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:12.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus, jaeger]

volumes:
  pg-data:
  maria-data:
  mongo-data:
