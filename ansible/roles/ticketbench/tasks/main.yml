- name: Create the deployment directory
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ tb_dir }}"
    - "{{ tb_dir }}/results"

- name: Copy compose file and configuration
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../{{ item }}"
    dest: "{{ tb_dir }}/"
    mode: preserve
  loop: [docker-compose.yml, otel, prometheus, grafana, config]

- name: Pull images
  ansible.builtin.command: docker compose pull --quiet
  args:
    chdir: "{{ tb_dir }}"
  environment:
    TB_VERSION: "{{ tb_version }}"
    TB_UID: "{{ ansible_user_uid }}"
    TB_GID: "{{ ansible_user_gid }}"
  changed_when: true

- name: Start the stack and wait until every service is healthy
  ansible.builtin.command: docker compose up -d --wait --wait-timeout 300
  args:
    chdir: "{{ tb_dir }}"
  environment:
    TB_VERSION: "{{ tb_version }}"
    TB_UID: "{{ ansible_user_uid }}"
    TB_GID: "{{ ansible_user_gid }}"
  changed_when: true

- name: Ping the runner and all stores
  ansible.builtin.command: docker compose run --rm tbench ping
  args:
    chdir: "{{ tb_dir }}"
  environment:
    TB_VERSION: "{{ tb_version }}"
    TB_UID: "{{ ansible_user_uid }}"
    TB_GID: "{{ ansible_user_gid }}"
  register: ticketbench_ping
  changed_when: false

- name: Show store versions
  ansible.builtin.debug:
    var: ticketbench_ping.stdout_lines
