- name: Run the benchmark matrix
  ansible.builtin.command: >-
    docker compose run --rm tbench matrix --config config/{{ tb_matrix }} --out results/{{ bench_run_name }}
  args:
    chdir: "{{ tb_dir }}"
  environment:
    TB_VERSION: "{{ tb_version }}"
    TB_UID: "{{ ansible_user_uid }}"
    TB_GID: "{{ ansible_user_gid }}"
  vars:
    bench_run_name: "ansible-{{ ansible_date_time.iso8601_basic_short }}"
  register: bench_run
  changed_when: true

- name: Find the newest result directory
  ansible.builtin.find:
    paths: "{{ tb_dir }}/results"
    file_type: directory
    patterns: "ansible-*"
  register: bench_dirs

- name: Generate the report files next to the results
  vars:
    bench_latest: "{{ (bench_dirs.files | sort(attribute='mtime') | last).path | basename }}"
  ansible.builtin.command: docker compose run --rm tbench report results/{{ bench_latest }} --out results/{{ bench_latest }}/report
  args:
    chdir: "{{ tb_dir }}"
  environment:
    TB_VERSION: "{{ tb_version }}"
    TB_UID: "{{ ansible_user_uid }}"
    TB_GID: "{{ ansible_user_gid }}"
  register: bench_report
  changed_when: true

- name: Show the hypothesis checks
  ansible.builtin.debug:
    var: bench_report.stdout_lines

- name: Copy results back to the controller
  ansible.posix.synchronize:
    mode: pull
    src: "{{ tb_dir }}/results/"
    dest: "{{ tb_results_local }}/"
  when: inventory_hostname != 'localhost'
