# Valkey for the security experiment: plain port 6379 and TLS port 6380.
port 6379
tls-port 6380
tls-cert-file /certs/server.crt
tls-key-file /certs/server.key
tls-ca-cert-file /certs/ca.crt
tls-auth-clients no
save ""
appendonly no
maxclients 10000
# default: admin-like user used for loading and resetting data
user default on nopass ~* &* +@all
# tbapp: application user, only the key prefixes of the model and no
# administrative or dangerous commands (FLUSHDB, CONFIG, KEYS, DEBUG ...)
user tbapp on >tb_app ~w:* ~wb:* ~wf:* ~r:* ~k:* ~blok:* ~sprzedaz ~przychod ~ix:* ~contend:* ~obj:* ~kat:* ~org:* ~kod:* &* +@all -@admin -@dangerous
